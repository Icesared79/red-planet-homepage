<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="../../assets/ds-loader.js"></script>
<style>body{margin:0;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:14px}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.pad{padding:22px}</style></head>
<body class="rp-root"><div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { Input, Select, Icon } = DS;

function App(){ return <div className="col" style={{gap:0}}>
<div className="pad" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16}}><Input label="Work email" placeholder="you@company.com" /><Select label="Market" options={['Connecticut','Florida','North Carolina','New York']} /><Input label="Company" error="Required" /></div>
<div className="pad" data-density="compact" data-product="atlas" style={{borderTop:'1px solid var(--rule)',display:'grid',gridTemplateColumns:'1.3fr 1fr 1fr 1fr',gap:10,alignItems:'end'}}>
<Input prefix={<Icon name="search" />} placeholder="Filter sources" /><Select options={['All statuses','Live','Stale','Failed']} /><Input label="Parcel ID" mono defaultValue="CT-001-04418" /><Input label="Run window" suffix="hrs" defaultValue="24" />
<Input label="Source ID" mono defaultValue="SRC-99999" error="No source with this ID" /><Input label="Disabled" disabled defaultValue="Locked" />
</div></div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
