<!-- @dsCard group="Components" viewport="700x400" name="Charts" subtitle="Run chart and trend line" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="../../assets/ds-loader.js"></script>
<style>body{margin:0;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:14px}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.pad{padding:22px}</style></head>
<body class="rp-root"><div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { RunChart, TrendChart, Metric } = DS;

const series=[20,21,21,22,22,22,23,23,24,24,24,25,31,33,34,35,35,36,36,37,37,38,38,39,40,40,41,41,42,44];
const hist=Array.from({length:40},(_,i)=>6+i*1.2+(i%3));
function App(){ return <div className="col" style={{gap:0}}>
<div data-surface="forest" className="pad col" style={{background:'var(--bg)',gap:22}}>
<RunChart title="Last night's run" meta="Updated 9 hours ago" total={127} flagged={78} height={34} />
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr'}}><Metric size="m" label="Pipeline steps completed" value="126 of 127" /><Metric size="m" label="Flagged for retry" value="1" tone="attention" /></div></div>
<div className="pad" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28}}>
<TrendChart title="Last 30 days" values={series} step startLabel="Aug 27" endLabel="Sep 26" height={70} />
<div className="col"><RunChart values={hist} steps={hist.map(()=> 'ink')} height={48} gap={2} /><div className="rp-chart__axis"><span>First night</span><span>Each night adds to the history</span></div></div></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
