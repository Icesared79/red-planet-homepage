<!-- @dsCard group="Components" viewport="700x330" name="Buttons" subtitle="Variants in both densities" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="../../assets/ds-loader.js"></script>
<style>body{margin:0;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:14px}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.pad{padding:22px}</style></head>
<body class="rp-root"><div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { Button, Icon } = DS;

function Set(){ return <>
<div className="row"><Button>Get in touch</Button><Button variant="secondary">Secondary</Button><Button variant="ghost">Ghost</Button><Button variant="link">How it works</Button><Button disabled>Disabled</Button></div>
</>; }
function App(){ return <div className="col" style={{gap:0}}>
<div className="pad col"><span className="l">Comfortable · Red Planet</span><Set/><div className="row"><Button variant="accent">Start the conversation</Button><Button size="sm" variant="secondary">Small</Button><Button size="lg">Large</Button><span className="l">accent = one closing CTA per page</span></div></div>
<div className="pad col" data-density="compact" data-product="atlas" style={{borderTop:'1px solid var(--rule)'}}><span className="l">Compact · Atlas</span>
<div className="row"><Button icon={<Icon name="plus" />}>Add source</Button><Button variant="secondary" icon={<Icon name="refresh-cw" />}>Re-run</Button><Button variant="ghost">Cancel</Button><Button variant="danger" icon={<Icon name="rotate-ccw" />}>Retry failed</Button><Button variant="secondary" iconOnly aria-label="Filter" icon={<Icon name="sliders-horizontal" />} /><Button variant="ghost" iconOnly aria-label="More" icon={<Icon name="ellipsis" />} /></div></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
