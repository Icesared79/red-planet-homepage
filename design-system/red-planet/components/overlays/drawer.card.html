<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="../../assets/ds-loader.js"></script>
<style>body{margin:0;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:14px}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.pad{padding:22px}</style></head>
<body class="rp-root"><div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { Drawer, Button, StatusIndicator, DataTable, Icon } = DS;

function App(){ const [o,setO]=React.useState(true); return <div data-density="compact" data-product="atlas" style={{position:'relative',height:420,overflow:'hidden'}}>
<div className="pad"><Button onClick={()=>setO(true)}>Open drawer</Button></div>
<Drawer inline open={o} onClose={()=>setO(false)} eyebrow="Source · SRC-0310" title="Miami-Dade Tax Collector" footer={<><Button variant="secondary">Pause source</Button><Button variant="danger" icon={<Icon name="rotate-ccw" />}>Retry now</Button></>}>
<div className="col"><StatusIndicator status="failed" meta="E-504 · 03:12" /><p className="rp-small" style={{fontSize:13,color:'var(--fg-2)'}}>The county server stopped responding during page 214 of 380. Atlas will retry at 04:00.</p>
<DataTable columns={[{key:'k',label:'Field',muted:true},{key:'v',label:'Value',mono:true,align:'right'}]} rows={[{id:1,k:'Records held',v:'1,204,551'},{id:2,k:'Last success',v:'2026-09-25 03:08'},{id:3,k:'Schedule',v:'Nightly 03:00'}]} /></div>
</Drawer></div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
