<!-- @dsCard group="Components" viewport="700x420" name="Cards, panels & sections" subtitle="Tonal cards, Atlas panels, page bands" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="../../assets/ds-loader.js"></script>
<style>body{margin:0;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:14px}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.pad{padding:22px}</style></head>
<body class="rp-root"><div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { Card, Panel, Section, Eyebrow, Button, Metric } = DS;

function App(){ return <div className="col" style={{gap:0}}>
<div className="pad" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
{['raised','sunken','sage','forest'].map(t=><Card key={t} tone={t} padding={16}><div className="l">tone="{t}"</div><div style={{font:'400 18px/1.15 var(--font-sans)',letterSpacing:'-0.02em',marginTop:28}}>Atlas</div></Card>)}</div>
<div className="pad" data-density="compact" data-product="atlas" style={{paddingTop:0,display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:10}}>
<Panel eyebrow="Monitor" title="Ingest volume" actions={<Button size="sm" variant="ghost">View runs</Button>}><Metric size="m" label="Rows today" value="4,812,330" delta="+2.1%" /></Panel>
<Panel title="Sources" footer={<span className="l">Updated 03:12</span>}><div className="rp-small" style={{fontSize:13,color:'var(--fg-2)'}}>Panel body with header row and footer.</div></Panel></div>
<Section tone="forest" style={{margin:'0 22px 22px','--section-pad-y':'28px','--page-gutter':'24px'}}><Eyebrow index={2}>Mission control</Eyebrow><h2 className="rp-display-m" style={{fontSize:28,marginTop:12}}>Atlas allows us to monitor the entire data stack every night.</h2></Section>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
