<!-- @dsCard group="Components" viewport="700x300" name="Tabs & top bar" subtitle="Red Planet top bar; underline and pill tabs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="../../assets/ds-loader.js"></script>
<style>body{margin:0;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:14px}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.pad{padding:22px}</style></head>
<body class="rp-root"><div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { TopBar, Tabs } = DS;

function App(){ return <div className="col" style={{gap:0}}>
<TopBar links={[{label:'Atlas'},{label:'How it works'},{label:'Coverage'},{label:'Documentation'}]} cta={{label:'Get in touch'}} style={{height:64,padding:'0 22px'}} />
<div className="pad col" style={{borderTop:'1px solid var(--rule)'}}><Tabs variant="pill" items={['Property records','Court and tax','Local government']} /></div>
<div className="pad col" data-density="compact" data-product="atlas" style={{borderTop:'1px solid var(--rule)'}}><Tabs items={[{value:'all',label:'All sources',count:'2,418'},{value:'live',label:'Live',count:'2,301'},{value:'stale',label:'Stale',count:48},{value:'failed',label:'Failed',count:3,attention:true},{value:'dormant',label:'Dormant',count:66}]} /></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
