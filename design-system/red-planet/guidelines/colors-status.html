<!-- @dsCard group="Colors" viewport="700x210" name="Status colors" subtitle="Positive, caution, attention, dormant on light and dark" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--fg-1)}*{box-sizing:border-box}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body class="rp-root"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div data-surface="" style="background:var(--bg);border-radius:10px;padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--positive)"></div><div style="font:500 12px/1.2 var(--font-sans)">Positive</div><div class="l">--positive<br>Live, verified, +delta</div></div><div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--caution)"></div><div style="font:500 12px/1.2 var(--font-sans)">Caution</div><div class="l">--caution<br>Stale, degraded</div></div><div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--attention)"></div><div style="font:500 12px/1.2 var(--font-sans)">Attention</div><div class="l">--attention<br>Failed, flagged</div></div><div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--dormant)"></div><div style="font:500 12px/1.2 var(--font-sans)">Dormant</div><div class="l">--dormant<br>Paused, inactive</div></div></div><div data-surface="forest" style="background:var(--bg);border-radius:10px;padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--positive)"></div><div style="font:500 12px/1.2 var(--font-sans)">Positive</div><div class="l">--positive<br>Live, verified, +delta</div></div><div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--caution)"></div><div style="font:500 12px/1.2 var(--font-sans)">Caution</div><div class="l">--caution<br>Stale, degraded</div></div><div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--attention)"></div><div style="font:500 12px/1.2 var(--font-sans)">Attention</div><div class="l">--attention<br>Failed, flagged</div></div><div style="display:grid;gap:6px"><div style="height:36px;border-radius:5px;background:var(--dormant)"></div><div style="font:500 12px/1.2 var(--font-sans)">Dormant</div><div class="l">--dormant<br>Paused, inactive</div></div></div></div></body></html>
