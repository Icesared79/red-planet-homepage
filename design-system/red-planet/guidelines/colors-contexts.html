<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--fg-1)}*{box-sizing:border-box}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body class="rp-root"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div  style="background:var(--bg);color:var(--fg-1);border-radius:12px;padding:16px;border:1px solid var(--rule);display:grid;gap:8px"><span class="rp-eyebrow">§ 04 — Page</span><span style="font:400 20px/1.1 var(--font-sans);letter-spacing:-0.02em">Headline</span><span style="font:400 12px/1.4 var(--font-sans);color:var(--fg-2)">Body copy</span><span class="l" style="border-top:1px solid var(--rule);padding-top:8px">none</span></div><div data-surface="paper" style="background:var(--bg);color:var(--fg-1);border-radius:12px;padding:16px;border:1px solid var(--rule);display:grid;gap:8px"><span class="rp-eyebrow">§ 00 — Paper</span><span style="font:400 20px/1.1 var(--font-sans);letter-spacing:-0.02em">Headline</span><span style="font:400 12px/1.4 var(--font-sans);color:var(--fg-2)">Body copy</span><span class="l" style="border-top:1px solid var(--rule);padding-top:8px">data-surface="paper"</span></div><div data-surface="sage" style="background:var(--bg);color:var(--fg-1);border-radius:12px;padding:16px;border:1px solid var(--rule);display:grid;gap:8px"><span class="rp-eyebrow">§ 04 — Sage</span><span style="font:400 20px/1.1 var(--font-sans);letter-spacing:-0.02em">Headline</span><span style="font:400 12px/1.4 var(--font-sans);color:var(--fg-2)">Body copy</span><span class="l" style="border-top:1px solid var(--rule);padding-top:8px">data-surface="sage"</span></div><div data-surface="forest" style="background:var(--bg);color:var(--fg-1);border-radius:12px;padding:16px;border:1px solid var(--rule);display:grid;gap:8px"><span class="rp-eyebrow">§ 01 — Forest</span><span style="font:400 20px/1.1 var(--font-sans);letter-spacing:-0.02em">Headline</span><span style="font:400 12px/1.4 var(--font-sans);color:var(--fg-2)">Body copy</span><span class="l" style="border-top:1px solid var(--rule);padding-top:8px">data-surface="forest"</span></div></div></body></html>
