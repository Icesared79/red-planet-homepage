<!-- @dsCard group="Colors" viewport="700x190" name="Forest & sage" subtitle="Dark and muted brand surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--fg-1)}*{box-sizing:border-box}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body class="rp-root"><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px">
<div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--forest-950);"></div><div style="font:500 12px/1.2 var(--font-sans)">Forest 950</div><div class="l">--forest-950<br>#151C18</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--forest-900);"></div><div style="font:500 12px/1.2 var(--font-sans)">Forest 900</div><div class="l">--forest-900<br>#1B241F</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--forest-800);"></div><div style="font:500 12px/1.2 var(--font-sans)">Forest 800 · band</div><div class="l">--forest-800<br>#222D27</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--forest-700);"></div><div style="font:500 12px/1.2 var(--font-sans)">Forest 700</div><div class="l">--forest-700<br>#2A3630</div></div>
<div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--sage-50);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Sage 50</div><div class="l">--sage-50<br>#EEF2EC</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--sage-100);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Sage 100</div><div class="l">--sage-100<br>#E3E9E1</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--sage-200);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Sage 200 · band</div><div class="l">--sage-200<br>#D5DDD3</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--sage-300);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Sage 300</div><div class="l">--sage-300<br>#C3CEC1</div></div></div></body></html>
