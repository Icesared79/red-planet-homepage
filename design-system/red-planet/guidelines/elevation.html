<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--fg-1)}*{box-sizing:border-box}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body class="rp-root"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;background:var(--bg-sunken);padding:22px;border-radius:12px">
<div style="background:var(--bg-raised);border-radius:8px;padding:14px;box-shadow:var(--elev-0);border:1px solid var(--rule);display:grid;gap:4px;height:90px;align-content:end"><span style="font:500 12px var(--font-sans)">--elev-0</span><span class="l">Page content, cards</span></div><div style="background:var(--bg-raised);border-radius:8px;padding:14px;box-shadow:var(--elev-1);;display:grid;gap:4px;height:90px;align-content:end"><span style="font:500 12px var(--font-sans)">--elev-1</span><span class="l">Map chips, menus</span></div><div style="background:var(--bg-raised);border-radius:8px;padding:14px;box-shadow:var(--elev-2);;display:grid;gap:4px;height:90px;align-content:end"><span style="font:500 12px var(--font-sans)">--elev-2</span><span class="l">Popovers, dropdowns</span></div><div style="background:var(--bg-raised);border-radius:8px;padding:14px;box-shadow:var(--elev-3);;display:grid;gap:4px;height:90px;align-content:end"><span style="font:500 12px var(--font-sans)">--elev-3</span><span class="l">Drawers</span></div></div></body></html>
