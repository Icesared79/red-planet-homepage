<!-- @dsCard group="Colors" viewport="700x190" name="Paper & ink" subtitle="Warm off-white base and green-black ink" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--fg-1)}*{box-sizing:border-box}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body class="rp-root"><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px">
<div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--paper-50);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Paper 50</div><div class="l">--paper-50<br>#F8F8F4</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--paper-100);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Paper 100 · page</div><div class="l">--paper-100<br>#F3F2ED</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--paper-200);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Paper 200</div><div class="l">--paper-200<br>#E8E8E1</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--paper-300);box-shadow:inset 0 0 0 1px var(--rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">Paper 300</div><div class="l">--paper-300<br>#DCDDD4</div></div>
<div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--ink-400);"></div><div style="font:500 12px/1.2 var(--font-sans)">Ink 400</div><div class="l">--ink-400<br>#90968F</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--ink-500);"></div><div style="font:500 12px/1.2 var(--font-sans)">Ink 500</div><div class="l">--ink-500<br>#646B65</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--ink-600);"></div><div style="font:500 12px/1.2 var(--font-sans)">Ink 600</div><div class="l">--ink-600<br>#4F5751</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:6px;background:var(--ink-900);"></div><div style="font:500 12px/1.2 var(--font-sans)">Ink 900 · text</div><div class="l">--ink-900<br>#141A16</div></div></div></body></html>
