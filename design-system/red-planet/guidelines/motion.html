<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Short ease-out fades; one live pulse" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--fg-1)}*{box-sizing:border-box}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body class="rp-root"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="border-top:1px solid var(--rule-ink);padding-top:10px;display:grid;gap:4px"><span style="font:500 12px var(--font-sans)">--dur-fast · 120ms</span><span class="l">Hover, color, border</span></div><div style="border-top:1px solid var(--rule-ink);padding-top:10px;display:grid;gap:4px"><span style="font:500 12px var(--font-sans)">--dur-base · 200ms</span><span class="l">Scrim, tabs, dimming</span></div><div style="border-top:1px solid var(--rule-ink);padding-top:10px;display:grid;gap:4px"><span style="font:500 12px var(--font-sans)">--dur-slow · 320ms</span><span class="l">Drawer slide</span></div><div style="border-top:1px solid var(--rule-ink);padding-top:10px;display:grid;gap:4px"><span style="font:500 12px var(--font-sans)">--ease-out</span><span class="l">cubic-bezier(.2,.7,.2,1)</span></div></div>
<div style="display:flex;gap:20px;margin-top:18px;align-items:center"><span class="rp-status rp-status--activating"><span class="rp-status__dot"></span>Activating pulse — the only looping animation</span><span class="l">respects prefers-reduced-motion</span></div></body></html>
