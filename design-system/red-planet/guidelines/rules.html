<!-- @dsCard group="Spacing" viewport="700x230" name="Borders & rules" subtitle="Hairline rules separate; the ink rule anchors headers" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--fg-1)}*{box-sizing:border-box}.l{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body class="rp-root"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px">
<div style="display:grid;gap:8px"><span class="l">--rule · hairline 12%</span><div style="border-top:1px solid var(--rule);padding-top:10px;font-size:13px">Row separator, panel border</div><div style="border-top:1px solid var(--rule);padding-top:10px;font-size:13px">Mechanics lien · Bridgeport</div></div>
<div style="display:grid;gap:8px"><span class="l">--rule-strong · 28%</span><div style="border:1px solid var(--rule-strong);border-radius:6px;height:32px;display:flex;align-items:center;padding:0 10px;font-size:13px">Field, secondary button</div></div>
<div style="display:grid;gap:8px"><span class="l">--rule-ink · table head</span><div style="border-bottom:1px solid var(--rule-ink);padding-bottom:8px" class="l">The source shows</div><span class="l" style="margin-top:6px">--border-accent · on dark</span><div data-surface="forest" style="background:var(--bg);padding:10px;border-radius:6px"><div style="border-top:1px solid var(--accent-fg)"></div></div></div></div></body></html>
